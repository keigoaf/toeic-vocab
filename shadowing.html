<!DOCTYPE html>
<!--
====================================================================
  TOEIC シャドーイング (TOEIC Shadowing Trainer)
  ファイル最終更新日時: 2026-07-30 09:40 (JST)
  バージョン: 1.2.0
--------------------------------------------------------------------
  【更新履歴】
    v1.2.0 (2026-07-30 09:40 JST)
      - 【不具合修正】下にスクロールすると、画面下に固定しているはずの
        操作バーが画面の途中に取り残される（上部ヘッダーも上に張り付か
        なくなる）問題を修正。
        原因: 文が変わるたびに scrollIntoView({behavior:'smooth'}) を
        呼んでいたため、iOS Safari でこのなめらかスクロールの最中に
        指で手動スクロールするとスクロール処理の状態が壊れ、
        position:fixed / sticky の要素が再配置されなくなっていた。
        対策: 自動スクロールを autoScrollTo() に作り直し、
          ①手動操作の直後4秒は自動スクロールしない
          ②その文がすでに見えているなら動かさない
          ③動かす場合もヘッダーと操作バーに隠れない範囲の中央へ寄せる
          ④設定から自動スクロール自体をオフにできる
        あわせて header / .dock を translateZ(0) で独立した描画レイヤーに
        載せ、.app に min-height:100vh を付けて index.html と構成を揃えた。
    v1.1.0 (2026-07-29 18:00 JST)
      - 教材を5本から30本に増補（shadowing.json も v1.1.0）。
      - 最後まで読み終わったあと▶︎を押すと、最終文だけが読まれて
        終わってしまっていた不具合を修正。読了時に再生位置を先頭へ
        戻すようにした（finish内）。
      - 教材が30本になり一覧が長くなったため、レベル(600/730/860)と
        形式(アナウンス/会話 など)で絞り込めるようにした。
      - 会話素材(Part3想定)を追加。話者記号 sp を画面に表示し、
        話者ごとに声の高さ(pitch)を変えて聞き分けやすくした。
        sp は読み上げ文には含めない（含めると「M」と発音されるため）。
    v1.0.0 (2026-07-29 14:20 JST) 初版
  ファイル: shadowing.html  （教材データ: shadowing.json）
--------------------------------------------------------------------
  【作成の意図 / 経緯】
    単語トレーナー(index.html)にシャドーイング練習機能が欲しい、という
    要望から新設。要件は次の4点:
      1. TOEICのリスニングを意識した 30秒〜2分程度の英文
      2. 再生ボタンで開始し、再生速度を変えられる
      3. 英文表示のON/OFF。ONなら読み上げに合わせて色が変わる
      4. 日本語訳もつける

  【方式の選定理由】
    音声はブラウザ内蔵の音声合成(Web Speech API)を使う。
      → 音声ファイルを同梱しないので容量が増えず、オフラインでも動く。
        単語トレーナーの 🔊 読み上げと同じ仕組みで一貫性がある。

  【ハイライトの実装（ここが肝）】
    ・再生は「1文＝1発話(utterance)」単位で行う。
      文単位なら onstart / onend が全ブラウザで確実に発火するため、
      「今どの文か」は必ず正しくハイライトできる。
    ・文の中の「今どの語か」は2段構えにした:
        (A) onboundary イベントが来る環境 → charIndex から語を特定（正確）
        (B) 来ない環境（iOS Safari は onboundary が発火しないことが多い）
            → 経過時間と文字数から位置を推定して進める
      (B)のために「1文字あたり何ミリ秒か(msPerChar)」を、実際に読み終えた
      時間から毎回学習して補正している(calibrate)。端末の音声エンジンが
      速くても遅くても、数文でズレが収まる。値は localStorage に保存。
    ・onboundary が1回でも来たら、その発話は(A)に切り替える。

  【一時停止の仕様】
    iOS の speechSynthesis.pause() は効かない/復帰しない不具合があるため、
    一時停止は「発話を止めて、今の文の先頭を覚えておく」方式にした。
    再開すると、その文の頭から読み直す。シャドーイング練習では
    文の途中から再開しても意味がないので、実用上もこの方が良い。

  【データ】
    shadowing.json の passages[] を読み込む。1文ずつ en / ja を持たせ、
    訳と英文が確実に対応するようにしている。
====================================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4BC4">
<title>TOEIC シャドーイング</title>
<style>
  /* index.html と同じデザイントークンを使い、見た目を揃える */
  :root{
    --bg:#EEF1F5;
    --surface:#FFFFFF;
    --ink:#17223B;
    --ink-soft:#5A6683;
    --line:#DBE0EA;
    --primary:#2F4BC4;
    --primary-soft:#EAEDFB;
    --accent:#E08A2B;
    --accent-soft:#FBEFDD;
    --good:#1F9E6E;
    --good-soft:#E1F4EC;
    --bad:#D8536B;
    --radius:16px;
    --shadow:0 2px 14px rgba(23,34,59,.08);
    --font-jp:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,system-ui,sans-serif;
    --font-en:'Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-jp);}
  body{padding-bottom:calc(150px + env(safe-area-inset-bottom));}
  /* v1.2.0: 正常に動いている index.html と同じ構成に合わせる
     （本文が短いときでもページ高さを確保し、固定要素の基準を安定させる） */
  .app{max-width:640px;margin:0 auto;min-height:100vh;}

  /* v1.2.0: iOSで固定要素が再配置されない不具合の対策として、
     translateZ(0) で独立した描画レイヤーに載せておく */
  header{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;
    transform:translateZ(0);-webkit-backface-visibility:hidden;}
  header h1{font-size:16px;margin:0;font-weight:800;flex:1;}
  .backlink{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:9px;
    padding:6px 10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;}
  .ver{font-size:10px;opacity:.75;}

  main{padding:14px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.7;}
  h2{font-size:14px;margin:0 0 10px;letter-spacing:.03em;}

  /* ---- 教材一覧 ---- */
  .plist{display:flex;flex-direction:column;gap:10px;}
  .pitem{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:13px 14px;cursor:pointer;border:1px solid transparent;}
  .pitem:active{border-color:var(--primary);}
  .pitem .pt{font-size:15px;font-weight:800;line-height:1.4;}
  .pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;
    background:var(--primary-soft);color:var(--primary);}
  .chip.acc{background:var(--accent-soft);color:#B36A16;}
  .chip.gray{background:var(--bg);color:var(--ink-soft);}
  .chip.done{background:var(--good-soft);color:var(--good);}

  /* ---- スクリプト（本文） ---- */
  .sent{padding:9px 11px;border-radius:11px;margin-bottom:7px;cursor:pointer;
    border:1px solid transparent;transition:background .12s;}
  .sent:active{border-color:var(--line);}
  .sent .en{font-family:var(--font-en);font-size:17px;line-height:1.95;}
  .sent .ja{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-top:5px;}
  /* v1.1.0: 会話素材の話者ラベル。読み上げには含めず表示のみ */
  .sp{display:inline-block;min-width:20px;text-align:center;font-size:10px;font-weight:800;
    border-radius:5px;padding:1px 5px;margin-right:7px;vertical-align:2px;font-family:var(--font-jp);}
  .sp-M{background:var(--primary-soft);color:var(--primary);}
  .sp-W{background:var(--accent-soft);color:#B36A16;}
  /* v1.1.0: 一覧の絞り込み */
  .filters{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
  .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .fchip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;}
  .fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .sent.active{background:var(--primary-soft);border-color:var(--primary);}
  /* 語ハイライト: 読んでいる語 / 読み終わった語 */
  .w{border-radius:4px;padding:1px 0;}
  .w.now{background:var(--accent);color:#fff;padding:1px 3px;margin:0 -3px;}
  .w.past{color:var(--ink-soft);}
  /* 英文非表示（シャドーイング時）: 行数だけ残して伏せる */
  .sent.hidden-en .en{filter:blur(6px);opacity:.45;user-select:none;}
  .sent.hidden-en.active .en{filter:blur(4px);}

  /* ---- 進捗 ---- */
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 10px;}
  .bar>i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s;}

  /* ---- 操作パネル（画面下固定） ---- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line);box-shadow:0 -3px 16px rgba(23,34,59,.10);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    /* v1.2.0: 同上。iOSでの再配置漏れを防ぐ */
    transform:translateZ(0);-webkit-backface-visibility:hidden;will-change:transform;}
  .dock-in{max-width:640px;margin:0 auto;}
  .row{display:flex;gap:8px;align-items:center;}
  .row + .row{margin-top:8px;}
  .btn{border:none;border-radius:11px;font-family:inherit;font-weight:800;cursor:pointer;
    padding:11px 12px;font-size:14px;background:var(--bg);color:var(--ink);}
  .btn:active{opacity:.7;}
  .btn.primary{background:var(--primary);color:#fff;}
  .btn.wide{flex:1;}
  .btn.sq{width:46px;padding:11px 0;font-size:16px;}
  .toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:9px;padding:7px 9px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;flex:1;}
  .toggle.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
  .rate-wrap{display:flex;align-items:center;gap:9px;}
  .rate-wrap input[type=range]{flex:1;accent-color:var(--primary);}
  .rate-val{font-family:var(--font-en);font-weight:700;font-size:13px;width:46px;text-align:right;}
  .mini{font-size:10.5px;color:var(--ink-soft);}

  /* ---- 設定パネル ---- */
  .panel{display:none;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:9px;}
  .panel.open{display:block;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:9px;padding:7px 4px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;}
  .seg button.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .flabel{font-size:11px;font-weight:800;color:var(--ink-soft);margin:9px 0 5px;letter-spacing:.05em;}

  /* ---- 練習ステップ / 語彙 ---- */
  .steps{display:flex;gap:6px;}
  .steps button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;
    padding:8px 4px;font-family:inherit;cursor:pointer;font-size:11px;font-weight:800;color:var(--ink);line-height:1.35;}
  .steps button.on{background:var(--accent-soft);border-color:var(--accent);color:#B36A16;}
  .steps small{display:block;font-weight:400;font-size:9.5px;color:var(--ink-soft);margin-top:2px;}
  .vrow{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);}
  .vrow b{font-family:var(--font-en);font-size:13.5px;}
  .vrow span{font-size:12px;color:var(--ink-soft);flex:1;}
  .empty{text-align:center;padding:36px 20px;color:var(--ink-soft);}
  .toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:9px 15px;border-radius:99px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:.2s;z-index:60;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="backlink" onclick="goBack()">←</button>
    <h1 id="hTitle">シャドーイング</h1>
    <span class="ver" id="verStamp"></span>
  </header>
  <main id="main"></main>
</div>
<div class="dock" id="dock" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   バージョン情報（デバッグ用）
   起動時にコンソールへ最初に出力し、ヘッダー右にも出す。
   どの版を動かしているか後から確認できるようにするため。
   ================================================================ */
const APP_VERSION  = "1.2.0";
const LAST_UPDATED = "2026-07-30 09:40 JST";
console.log(`%c[TOEICシャドーイング] 最終更新日時: ${LAST_UPDATED} / version ${APP_VERSION}`,
            "color:#2F4BC4;font-weight:bold;");

/* ================================================================
   状態
   ================================================================ */
const LS_KEY = 'toeic-shadowing';
const DEFAULTS = {
  rate: 1.0,        // 再生速度
  showEn: true,     // 英文を表示するか
  showJa: true,     // 和訳を表示するか
  wordHL: true,     // 語単位でハイライトするか（OFFなら文だけ光る）
  gap: 0,           // 文と文の間に入れる無音（ミリ秒）
  autoScroll: true, // v1.2.0: 読んでいる文まで自動でスクロールするか
  repeat: 1,        // 各文を何回読むか
  loop: false,      // 最後まで行ったら先頭に戻るか
  msPerChar: 58,    // 推定ハイライト用の校正値（端末ごとに学習）
  voiceURI: ''      // 選んだ音声
};
let CFG = Object.assign({}, DEFAULTS);
let LOG = {};       // { passageId: {count, last} } 練習回数の記録

let PASSAGES = [];
let view = 'list';      // 'list' | 'play'
let cur = null;         // 再生中の教材
let curIdx = 0;         // 何文目か
let playing = false;
let repeatLeft = 0;
let timer = null, raf = null;
let boundaryMode = false;   // onboundary が来た発話か
let gen = 0;                // 発話の世代番号（中断された発話を無視するため）
let uttStart = 0;
let panelOpen = false;
let stepPreset = '';        // 選択中の練習ステップ
/* v1.1.0: 教材が30本になったので一覧を絞り込めるようにする */
let fLevel = 'all';        // 'all' | '600' | '730' | '860'
let fKind  = 'all';        // 'all' | 'talk'(モノローグ) | 'conv'(会話)

function loadCfg(){
  try{
    const j = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    CFG = Object.assign({}, DEFAULTS, j.cfg || {});
    LOG = j.log || {};
  }catch(e){ /* 壊れていたら初期値で続行 */ }
}
function saveCfg(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ cfg:CFG, log:LOG })); }catch(e){}
}

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1700);
}
function goBack(){
  if(view === 'play'){ stop(); render('list'); return; }
  location.href = './index.html';
}

/* ================================================================
   教材データの読み込み
   ================================================================ */
async function loadData(){
  try{
    const res = await fetch('./shadowing.json', { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    PASSAGES = j.passages || [];
  }catch(e){
    console.warn('教材の読み込み失敗:', e);
    PASSAGES = [];
  }
}

/* 語数と目安の秒数（150 wpm を基準に、速度で割り戻す） */
function wordCount(p){
  return p.sentences.reduce((n,s)=> n + (s.en.match(/[A-Za-z'’-]+/g)||[]).length, 0);
}
function estSec(p, rate){
  return Math.round(wordCount(p) / (150*(rate||1)) * 60);
}
function fmtSec(s){
  const m = Math.floor(s/60), r = s%60;
  return m>0 ? `${m}分${String(r).padStart(2,'0')}秒` : `${r}秒`;
}

/* ================================================================
   画面描画
   ================================================================ */
function render(v){
  if(v) view = v;
  document.getElementById('verStamp').textContent = 'v'+APP_VERSION;
  if(view === 'list') renderList(); else renderPlay();
}

function renderList(){
  document.getElementById('hTitle').textContent = 'シャドーイング';
  document.getElementById('dock').style.display = 'none';
  const main = document.getElementById('main');
  if(PASSAGES.length === 0){
    main.innerHTML = `<div class="empty"><p>教材を読み込めませんでした。<br>
      <b>shadowing.json</b> を index.html と同じフォルダに置いてください。</p></div>`;
    return;
  }
  // 会話素材かどうか（話者記号を持つ文があるか）で判定
  const isConv = p => p.sentences.some(x=>x.sp);
  const shown = PASSAGES.filter(p=>
    (fLevel==='all' || String(p.level)===fLevel) &&
    (fKind==='all'  || (fKind==='conv' ? isConv(p) : !isConv(p)))
  );
  const chip = (cur,val,label,fn)=>
    `<button class="fchip ${cur===val?'on':''}" onclick="${fn}('${val}')">${label}</button>`;
  const filters = `
    <div class="filters">
      <div class="frow">
        ${chip(fLevel,'all','すべて '+PASSAGES.length+'本','setFLevel')}
        ${chip(fLevel,'600','600点','setFLevel')}
        ${chip(fLevel,'730','730点','setFLevel')}
        ${chip(fLevel,'860','860点','setFLevel')}
      </div>
      <div class="frow">
        ${chip(fKind,'all','形式すべて','setFKind')}
        ${chip(fKind,'talk','ひとり語り','setFKind')}
        ${chip(fKind,'conv','会話','setFKind')}
      </div>
    </div>`;
  const items = shown.map(p=>{
    const lg = LOG[p.id];
    return `<div class="pitem" onclick="open_('${p.id}')">
      <div class="pt">${esc(p.title)}</div>
      <div class="pmeta">
        <span class="chip">${esc(p.category)}</span>
        <span class="chip acc">${p.level}点レベル</span>
        <span class="chip gray">${wordCount(p)}語 / 約${fmtSec(estSec(p,1))}</span>
        ${lg&&lg.count?`<span class="chip done">練習 ${lg.count}回</span>`:''}
      </div>
    </div>`;
  }).join('');
  main.innerHTML = `
    <div class="card">
      <h2>シャドーイングの進め方</h2>
      <p class="note">
        いきなり口に出すのは難しいので、同じ教材を次の順で回すのが効果的です。<br>
        ① <b>聞く</b>（英文は伏せ、和訳で内容をつかむ）→
        ② <b>オーバーラッピング</b>（英文を見ながら音に重ねて読む・0.8倍速）→
        ③ <b>シャドーイング</b>（英文を伏せ、少し遅れて追いかける）→
        ④ <b>リピーティング</b>（1文ずつ、間を置いて再現する）。<br>
        教材を開くと、この4ステップをワンタップで切り替えられます。
      </p>
    </div>
    ${filters}
    <div class="plist">${items || '<div class="empty">該当する教材がありません</div>'}</div>
    <div class="card"><p class="note">
      音声は端末内蔵の音声合成を使っています（音声ファイルの通信なし・オフラインでも動作）。
      声の種類は下の⚙️から選べます。端末に英語音声が入っていないと再生できません。
    </p></div>`;
}

function setFLevel(v){ fLevel = v; renderList(); }
function setFKind(v){  fKind  = v; renderList(); }

function open_(id){
  cur = PASSAGES.find(p=>p.id===id);
  if(!cur) return;
  curIdx = 0; playing = false; stepPreset = '';
  render('play');
}

function renderPlay(){
  const p = cur;
  document.getElementById('hTitle').textContent = p.title;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="pmeta" style="margin:0 0 10px">
        <span class="chip">${esc(p.category)}</span>
        <span class="chip acc">${p.level}点レベル</span>
        <span class="chip gray">${esc(p.scene)}</span>
        <span class="chip gray">${wordCount(p)}語 / 約${fmtSec(estSec(p,CFG.rate))}</span>
      </div>
      <div class="flabel">練習ステップ</div>
      <div class="steps">
        ${stepBtn('listen','① 聞く','和訳のみ')}
        ${stepBtn('overlap','② 重ねる','英文+0.8倍')}
        ${stepBtn('shadow','③ 追う','英文を伏せる')}
        ${stepBtn('repeat','④ 再現','1文ずつ間を置く')}
      </div>
    </div>

    <div class="bar"><i id="bar"></i></div>
    <div class="card" id="script">${renderScript()}</div>

    <div class="card">
      <h2>この教材のキーフレーズ</h2>
      ${p.vocab.map(v=>`<div class="vrow"><b>${esc(v.term)}</b><span>${esc(v.meaning)}</span></div>`).join('')}
    </div>
    <div class="card">
      <h2>音のポイント</h2>
      <p class="note">${esc(p.tip)}</p>
    </div>
    <div class="card">
      <p class="note">文をタップすると、その文から再生します。<br>
      画面下のバーで速度・表示・くり返しを変えられます。</p>
    </div>`;
  renderDock();
  updateBar();
}

function stepBtn(key, label, sub){
  return `<button class="${stepPreset===key?'on':''}" onclick="applyStep('${key}')">${label}<small>${sub}</small></button>`;
}

/* 練習ステップのプリセット。設定をまとめて切り替える。 */
function applyStep(key){
  stepPreset = key;
  if(key==='listen'){  CFG.showEn=false; CFG.showJa=true;  CFG.rate=1.0; CFG.gap=0;    CFG.repeat=1; }
  if(key==='overlap'){ CFG.showEn=true;  CFG.showJa=false; CFG.rate=0.8; CFG.gap=0;    CFG.repeat=1; }
  if(key==='shadow'){  CFG.showEn=false; CFG.showJa=false; CFG.rate=1.0; CFG.gap=0;    CFG.repeat=1; }
  if(key==='repeat'){  CFG.showEn=true;  CFG.showJa=true;  CFG.rate=0.9; CFG.gap=2500; CFG.repeat=1; }
  saveCfg();
  const was = playing; stop();
  renderPlay();
  if(was) play();
}

/* 本文（1文ずつ <div class="sent"> に分ける） */
function renderScript(){
  return cur.sentences.map((s,i)=>{
    const cls = ['sent'];
    if(i===curIdx) cls.push('active');
    if(!CFG.showEn) cls.push('hidden-en');
    const en = CFG.wordHL ? tokenHtml(s.en, i) : esc(s.en);
    // v1.1.0: 会話素材は話者ラベルを英文の前に出す（読み上げ対象外）
    const spTag = s.sp ? `<span class="sp sp-${esc(s.sp)}">${esc(s.sp)}</span>` : '';
    return `<div class="${cls.join(' ')}" id="s${i}" onclick="jump(${i})">
      <div class="en">${spTag}${en}</div>
      ${CFG.showJa ? `<div class="ja">${esc(s.ja)}</div>` : ''}
    </div>`;
  }).join('');
}

/* 語ごとに span を作る。data-a/data-b はその語の文字位置（onboundary対応用） */
function tokenHtml(text, si){
  const toks = tokenize(text);
  let out = '', pos = 0;
  toks.forEach((t,k)=>{
    out += esc(text.slice(pos, t.a));
    out += `<span class="w" id="w${si}_${k}" data-a="${t.a}" data-b="${t.b}">${esc(text.slice(t.a,t.b))}</span>`;
    pos = t.b;
  });
  out += esc(text.slice(pos));
  return out;
}
const TOK_CACHE = {};
function tokenize(text){
  if(TOK_CACHE[text]) return TOK_CACHE[text];
  const re = /\S+/g, out = []; let m;
  while((m = re.exec(text))) out.push({ a:m.index, b:m.index+m[0].length });
  TOK_CACHE[text] = out;
  return out;
}

/* ================================================================
   操作パネル
   ================================================================ */
function renderDock(){
  const d = document.getElementById('dock');
  d.style.display = '';
  d.innerHTML = `<div class="dock-in">
    <div class="row">
      <button class="btn sq" onclick="prev()">⏮</button>
      <button class="btn primary wide" id="playBtn" onclick="toggle()">${playing?'⏸ 一時停止':'▶︎ 再生'}</button>
      <button class="btn sq" onclick="next()">⏭</button>
      <button class="btn sq" onclick="togglePanel()">⚙️</button>
    </div>
    <div class="row rate-wrap">
      <span class="mini">速度</span>
      <input type="range" min="0.5" max="1.3" step="0.05" value="${CFG.rate}"
             oninput="setRate(this.value)">
      <span class="rate-val" id="rateVal">${Number(CFG.rate).toFixed(2)}x</span>
    </div>
    <div class="row">
      <button class="toggle ${CFG.showEn?'on':''}" onclick="tg('showEn')">英文 ${CFG.showEn?'表示':'非表示'}</button>
      <button class="toggle ${CFG.showJa?'on':''}" onclick="tg('showJa')">和訳 ${CFG.showJa?'表示':'非表示'}</button>
      <button class="toggle ${CFG.loop?'on':''}" onclick="tg('loop')">🔁 ループ</button>
    </div>
    <div class="panel ${panelOpen?'open':''}" id="panel">
      <div class="flabel">ハイライト</div>
      <div class="seg">
        <button class="${CFG.wordHL?'on':''}" onclick="setHL(true)">語ごとに色が動く</button>
        <button class="${!CFG.wordHL?'on':''}" onclick="setHL(false)">文だけ光る</button>
      </div>
      <div class="flabel">文のあとの間（リピーティング用）</div>
      <div class="seg">
        ${[0,1000,2000,3000].map(g=>`<button class="${CFG.gap===g?'on':''}" onclick="setGap(${g})">${g===0?'なし':(g/1000)+'秒'}</button>`).join('')}
      </div>
      <div class="flabel">自動スクロール</div>
      <div class="seg">
        <button class="${CFG.autoScroll?'on':''}" onclick="setAuto(true)">読んでいる文を追う</button>
        <button class="${!CFG.autoScroll?'on':''}" onclick="setAuto(false)">動かさない</button>
      </div>
      <div class="flabel">各文をくり返す回数</div>
      <div class="seg">
        ${[1,2,3].map(n=>`<button class="${CFG.repeat===n?'on':''}" onclick="setRep(${n})">${n}回</button>`).join('')}
      </div>
      <div class="flabel">音声（英語）</div>
      <div id="voiceBox"></div>
      <p class="mini" style="margin:9px 0 0;line-height:1.7">
        一時停止したときは、今の文の先頭から再開します。<br>
        ハイライトが音とずれる端末では、数文再生すると自動で合ってきます
        （読み上げ速度を計測して補正しています）。
      </p>
    </div>
  </div>`;
  renderVoices();
}
function togglePanel(){ panelOpen = !panelOpen; document.getElementById('panel').classList.toggle('open', panelOpen); }
function tg(key){
  CFG[key] = !CFG[key]; saveCfg(); stepPreset='';
  if(key==='loop'){ renderDock(); return; }
  const was = playing;
  document.getElementById('script').innerHTML = renderScript();
  renderDock();
  if(was) highlightSentence(curIdx);
}
function setRate(v){
  CFG.rate = Number(v); saveCfg();
  document.getElementById('rateVal').textContent = CFG.rate.toFixed(2)+'x';
  // 再生中なら、今の文の頭から新しい速度で読み直す（途中変更は反映されないため）
  if(playing){ gen++; try{ speechSynthesis.cancel(); }catch(e){} clearTimers(); speakSentence(curIdx); }
}
function setHL(b){ CFG.wordHL=b; saveCfg(); document.getElementById('script').innerHTML=renderScript(); renderDock(); }
function setGap(g){ CFG.gap=g; saveCfg(); renderDock(); }
function setAuto(b){ CFG.autoScroll=b; saveCfg(); renderDock(); }
function setRep(n){ CFG.repeat=n; saveCfg(); renderDock(); }

/* ================================================================
   音声（voice）の選択
   ================================================================ */
function englishVoices(){
  try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){ return []; }
}
function renderVoices(){
  const box = document.getElementById('voiceBox');
  if(!box) return;
  const vs = englishVoices();
  if(vs.length === 0){ box.innerHTML = `<p class="mini">英語の音声が見つかりません。端末の設定から英語の音声を追加してください。</p>`; return; }
  box.innerHTML = `<select onchange="setVoice(this.value)"
      style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--ink)">
      ${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${CFG.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)}（${esc(v.lang)}）</option>`).join('')}
    </select>`;
}
function setVoice(uri){ CFG.voiceURI = uri; saveCfg(); toast('音声を変更しました'); }
function pickVoice(){
  const vs = englishVoices();
  if(vs.length === 0) return null;
  return vs.find(v=>v.voiceURI===CFG.voiceURI)
      || vs.find(v=>/en[-_]US/i.test(v.lang))
      || vs[0];
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ renderVoices(); };
}

/* ================================================================
   再生エンジン
   ----------------------------------------------------------------
   1文＝1発話。onstart/onend は全環境で確実に来るので、
   「どの文か」はこれで管理する。文中の語位置は
   onboundary（来れば正確）／経過時間からの推定（来なければ）で出す。
   ================================================================ */
function clearTimers(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(raf){ cancelAnimationFrame(raf); raf=null; }
}
function toggle(){ playing ? pause() : play(); }

function play(){
  if(!('speechSynthesis' in window)){ toast('この端末は音声読み上げに対応していません'); return; }
  if(englishVoices().length === 0 && speechSynthesis.getVoices().length === 0){
    // iOSは初回に voices が空のことがある。少し待って再試行。
    setTimeout(()=>{ playing=true; refreshPlayBtn(); speakSentence(curIdx); }, 250);
    playing = true; refreshPlayBtn(); return;
  }
  playing = true; refreshPlayBtn();
  speakSentence(curIdx);
}
function pause(){
  playing = false; gen++;              // 走っている発話を無効化してから止める
  refreshPlayBtn();
  try{ speechSynthesis.cancel(); }catch(e){}
  clearTimers(); clearWordHL();
}
function stop(){
  playing = false; curIdx = 0; repeatLeft = 0; gen++;
  try{ speechSynthesis.cancel(); }catch(e){}
  clearTimers();
}
function refreshPlayBtn(){
  const b = document.getElementById('playBtn');
  if(b) b.textContent = playing ? '⏸ 一時停止' : '▶︎ 再生';
}
function prev(){ jump(Math.max(0, curIdx-1)); }
function next(){ jump(Math.min(cur.sentences.length-1, curIdx+1)); }
function jump(i){
  curIdx = i; repeatLeft = 0; gen++;
  try{ speechSynthesis.cancel(); }catch(e){}
  clearTimers();
  highlightSentence(i); updateBar();
  if(playing) speakSentence(i); else { playing = true; refreshPlayBtn(); speakSentence(i); }
}

function speakSentence(i){
  const s = cur && cur.sentences[i];
  if(!s){ finish(); return; }
  // ここで世代を進める。cancel() は「読み上げ中だった発話の onend」を
  // 発火させる仕様なので、そのままだと古い発話の onend が次の文へ
  // 勝手に進めてしまう（速度変更・文タップ時に2文飛ぶ不具合になる）。
  // 発話ごとに世代番号を持たせ、最新でなければ何もしない、で防ぐ。
  const myGen = ++gen;
  curIdx = i;
  highlightSentence(i); updateBar();

  const u = new SpeechSynthesisUtterance(s.en);
  u.lang = 'en-US';
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = CFG.rate;
  // v1.1.0: 声は1種類しか使えないので、会話素材は話者で高さを変えて
  //         聞き分けられるようにする（読み上げ文自体は変えない）
  u.pitch = s.sp === 'W' ? 1.18 : (s.sp === 'M' ? 0.82 : 1.0);

  boundaryMode = false;
  const toks = tokenize(s.en);

  u.onstart = ()=>{
    if(myGen !== gen) return;
    uttStart = performance.now();
    if(CFG.wordHL) tick(i, s.en.length, toks, myGen);
  };
  u.onboundary = (e)=>{
    if(myGen !== gen || !CFG.wordHL) return;
    boundaryMode = true;                       // 以降はイベント主導（正確）
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    setWordByChar(i, toks, e.charIndex||0);
  };
  u.onend = ()=>{
    if(myGen !== gen) return;                  // 中断された発話は無視
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    calibrate(s.en.length, performance.now()-uttStart);
    markSentenceDone(i, toks);
    if(!playing) return;
    afterSentence(i, myGen);
  };
  u.onerror = ()=>{ if(raf){ cancelAnimationFrame(raf); raf=null; } };

  // iOS対策: cancel直後の speak が無視されることがあるので一拍置く
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(()=>{ if(playing && myGen === gen) speechSynthesis.speak(u); }, 40);
}

/* 1文読み終わったあと: くり返し → 間 → 次の文 */
function afterSentence(i, myGen){
  if(repeatLeft === 0) repeatLeft = CFG.repeat - 1; else repeatLeft--;
  const again = repeatLeft > 0;
  const wait = CFG.gap;
  const go = ()=>{
    if(!playing || myGen !== gen) return;   // 中断されていたら進めない
    if(again) speakSentence(i);
    else if(i+1 < cur.sentences.length) speakSentence(i+1);
    else if(CFG.loop){ countUp(); speakSentence(0); }
    else finish();
  };
  if(wait > 0) timer = setTimeout(go, wait); else go();
}
function finish(){
  playing = false; refreshPlayBtn(); clearTimers(); clearWordHL();
  countUp();
  // v1.1.0: 最後まで読み終わったら再生位置を先頭に戻す。
  //   以前は最終文のまま止まっていたため、もう一度▶︎を押しても
  //   最後の1文だけが読まれて終わってしまっていた。
  curIdx = 0; repeatLeft = 0;
  highlightSentence(0); updateBar();
  toast('お疲れさまでした。もう1周すると定着します');
}
function countUp(){
  const id = cur.id;
  LOG[id] = LOG[id] || { count:0, last:0 };
  LOG[id].count++; LOG[id].last = Date.now();
  saveCfg();
}

/* ---- ハイライト ---- */
function highlightSentence(i){
  document.querySelectorAll('.sent').forEach((el,k)=> el.classList.toggle('active', k===i));
  clearWordHL();
  autoScrollTo(document.getElementById('s'+i));
}

/* ================================================================
   v1.2.0: 自動スクロールの作り直し
   ----------------------------------------------------------------
   【不具合】
     下にスクロールすると、画面下に固定しているはずの操作バーが
     画面の途中に取り残される（上部ヘッダーも上に張り付かなくなる）。
   【原因】
     文が変わるたびに scrollIntoView({behavior:'smooth'}) を呼んで
     いた。iOS Safari では、この「プログラムによるなめらかスクロール」
     の最中に指で手動スクロールすると、スクロール処理の状態が壊れ、
     position:fixed / position:sticky の要素が再配置されなくなる。
     結果、操作バーが画面中央に貼り付いたように見える。
   【対策】
     ① 手動スクロール(指で触った)直後は自動スクロールしない
     ② その文がすでに見えているなら動かさない（無駄な発火をなくす）
     ③ 動かす場合も、ヘッダーと操作バーに隠れない範囲の中央へ寄せる
     ④ 設定から自動スクロール自体をオフにできるようにする
   ================================================================ */
// 初期値を0にすると、ページを開いて最初の4秒間は「たった今 手動操作した」と
// 誤判定して自動スクロールが効かなくなる。十分に過去の値を入れておく。
let lastTouch = -1e9;   // 最後に手動操作した時刻
['touchstart','touchmove','wheel'].forEach(ev=>{
  window.addEventListener(ev, ()=>{ lastTouch = performance.now(); }, { passive:true });
});
function autoScrollTo(el){
  if(!el || !CFG.autoScroll) return;
  // ①手動操作の直後は触らない（競合させない）
  if(performance.now() - lastTouch < 4000) return;
  const r = el.getBoundingClientRect();
  const top    = 96;                      // ヘッダーの下端の目安
  const bottom = window.innerHeight - 176; // 操作バーの上端の目安
  if(bottom <= top) return;
  // ②すでに読める位置にあるなら動かさない
  if(r.top >= top && r.bottom <= bottom) return;
  // ③ヘッダーと操作バーの間の中央へ寄せる
  const delta = (r.top + r.height/2) - (top + bottom)/2;
  window.scrollTo({ top: Math.max(0, window.scrollY + delta), behavior:'smooth' });
}
function clearWordHL(){
  document.querySelectorAll('.w.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('.w.past').forEach(e=>e.classList.remove('past'));
}
function setWord(i, k){
  const el = document.getElementById(`w${i}_${k}`);
  if(!el || el.classList.contains('now')) return;
  clearWordHL();
  for(let n=0;n<k;n++){
    const p = document.getElementById(`w${i}_${n}`);
    if(p) p.classList.add('past');
  }
  el.classList.add('now');
}
function setWordByChar(i, toks, ch){
  let k = 0;
  for(let n=0;n<toks.length;n++){ if(toks[n].a <= ch) k = n; else break; }
  setWord(i, k);
}
function markSentenceDone(i, toks){
  clearWordHL();
  for(let n=0;n<toks.length;n++){
    const p = document.getElementById(`w${i}_${n}`);
    if(p) p.classList.add('past');
  }
}

/* onboundary が来ない環境用: 経過時間から今の語位置を推定して進める */
function tick(i, totalChars, toks, myGen){
  const step = ()=>{
    if(!playing || boundaryMode || myGen !== gen){ raf=null; return; }
    const elapsed = performance.now() - uttStart;
    const msPerChar = CFG.msPerChar / (CFG.rate || 1);
    const ch = elapsed / msPerChar;
    setWordByChar(i, toks, Math.min(ch, totalChars));
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
/* 実際に読み終わった時間から「1文字あたり何ms」を学習して補正する。
   端末の音声エンジンが速くても遅くても、数文で追従する。 */
function calibrate(chars, ms){
  if(chars < 20 || ms < 300) return;              // 短すぎる文は誤差が大きいので使わない
  const measured = (ms / chars) * (CFG.rate || 1);
  if(measured < 20 || measured > 200) return;     // 明らかに異常な値は捨てる
  CFG.msPerChar = CFG.msPerChar*0.7 + measured*0.3;
  saveCfg();
}

function updateBar(){
  const b = document.getElementById('bar');
  if(b && cur) b.style.width = ((curIdx+1)/cur.sentences.length*100) + '%';
}

/* 画面を離れたら必ず音を止める（バックグラウンド再生の暴走防止） */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });
window.addEventListener('pagehide', ()=>{ try{ speechSynthesis.cancel(); }catch(e){} });

/* ================================================================
   起動
   ================================================================ */
(async function init(){
  loadCfg();
  await loadData();
  render('list');
})();
</script>
